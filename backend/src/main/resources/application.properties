spring.application.name=backend

# PostgreSQL Database Configuration (Environment Variable Driven with Local Defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queueless}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration (Environment Variable Driven with Local Defaults)
queueless.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
queueless.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
queueless.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
queueless.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# QR Pickup Configuration
queueless.qr.expiration-minutes=${QR_EXPIRATION_MINUTES:30}

# Trust & Suspension Configuration
queueless.trust.user-suspension-threshold=${USER_SUSPENSION_THRESHOLD:3}
queueless.trust.shop-suspension-threshold=${SHOP_SUSPENSION_THRESHOLD:3}

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
