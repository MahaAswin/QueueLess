spring.application.name=backend

# PostgreSQL Database Configuration (Environment Variable Driven)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Environment Variable Driven)
queueless.jwt.secret=${JWT_SECRET}
queueless.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION}
queueless.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION}
